name: macOS CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version (optional for dev build; required if publish_release is true, e.g. 0.1.0)"
        required: false
        type: string
      publish_release:
        description: "Publish a GitHub Release (manual dispatch only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.ref_name) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && format('release-manual-{0}', inputs.version || github.ref_name)) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)) }}

jobs:
  build-and-test:
    name: Build, Test & Package DMG (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 45

    outputs:
      is_release: ${{ steps.mode.outputs.is_release }}
      is_prerelease: ${{ steps.mode.outputs.is_prerelease }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
      version: ${{ steps.mode.outputs.version }}
      archive_name: ${{ steps.mode.outputs.archive_name }}
      artifact_name: ${{ steps.mode.outputs.artifact_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Build & Release Policy
        id: mode
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          ARCH="$(uname -m)"
          echo "Runner macOS: $(sw_vers -productVersion) (${ARCH})"

          if [[ "${ARCH}" != "arm64" ]]; then
            echo "::error::Expected Apple Silicon (arm64) runner, got '${ARCH}'."
            exit 1
          fi

          IS_TAG_RELEASE="false"
          IS_MANUAL_RELEASE="false"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_PUBLISH_RELEASE}" == "true" ]]; then
            IS_MANUAL_RELEASE="true"
          fi

          IS_RELEASE="false"
          if [[ "${IS_TAG_RELEASE}" == "true" || "${IS_MANUAL_RELEASE}" == "true" ]]; then
            IS_RELEASE="true"
          fi

          if [[ "${IS_MANUAL_RELEASE}" == "true" && -z "${INPUT_VERSION}" ]]; then
            echo "::error::Manual release dispatch requires an explicit 'version' input (e.g. 0.1.0)."
            exit 1
          fi

          IS_PRERELEASE="false"
          if [[ "${IS_TAG_RELEASE}" == "true" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION="${RELEASE_TAG#v}"
            if [[ "${RELEASE_TAG}" == *-* ]]; then
              IS_PRERELEASE="true"
            fi
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            RELEASE_TAG="v${VERSION}"
            if [[ "${VERSION}" == *-* ]]; then
              IS_PRERELEASE="true"
            fi
          else
            VERSION="0.1.0-dev.${SHORT_SHA}"
            RELEASE_TAG=""
          fi

          ARCHIVE_NAME="LucidSQL-${VERSION}-macos-${ARCH}"
          ARTIFACT_NAME="${ARCHIVE_NAME}-dmg"

          {
            echo "is_release=${IS_RELEASE}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "release_tag=${RELEASE_TAG}"
            echo "version=${VERSION}"
            echo "archive_name=${ARCHIVE_NAME}"
            echo "artifact_name=${ARTIFACT_NAME}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify Rust, Xcode 26 SDK & Swift Toolchains
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "${GITHUB_PATH}"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

          rustc --version
          cargo --version
          xcode-select -p
          xcodebuild -version
          swift --version

          SDK_VER="$(xcrun --show-sdk-version)"
          SDK_MAJOR="${SDK_VER%%.*}"
          echo "macOS SDK version: ${SDK_VER}"
          if [[ ! "${SDK_MAJOR}" =~ ^[0-9]+$ ]] || [[ "${SDK_MAJOR}" -lt 26 ]]; then
            echo "::error::macOS 26+ SDK is required to compile Liquid Glass UI (found ${SDK_VER})."
            exit 1
          fi

      - name: Provision Disposable PostgreSQL 16 for Tests
        run: |
          set -euo pipefail
          if ! brew list postgresql@16 >/dev/null 2>&1; then
            brew install postgresql@16
          fi
          PG_BIN="/opt/homebrew/opt/postgresql@16/bin"
          if [[ ! -d "${PG_BIN}" ]]; then
            PG_BIN="$(brew --prefix postgresql@16)/bin"
          fi
          echo "${PG_BIN}" >> "${GITHUB_PATH}"
          export PATH="${PG_BIN}:$PATH"

          # Ensure no pre-existing Homebrew service holds port 5432.
          brew services stop postgresql@16 >/dev/null 2>&1 || true

          PG_DATA="${RUNNER_TEMP}/ci_pgdata"
          PG_SOCK="${RUNNER_TEMP}/ci_pgsock"
          PG_LOG="${RUNNER_TEMP}/ci_pg.log"
          rm -rf "${PG_DATA}" "${PG_SOCK}" "${PG_LOG}"
          mkdir -p "${PG_DATA}" "${PG_SOCK}"

          initdb -D "${PG_DATA}" -U "${USER}" -A trust -E UTF8 --no-locale
          pg_ctl -D "${PG_DATA}" -l "${PG_LOG}" -o "-p 5432 -k ${PG_SOCK} -h 127.0.0.1" start
          pg_isready -h 127.0.0.1 -p 5432
          psql -h 127.0.0.1 -p 5432 -U "${USER}" -d postgres -c "SELECT version();"

      - name: Build Rust Core, Generate UniFFI Bridge & Run All Tests
        run: |
          set -euo pipefail
          ./tests/bridge_smoke_test.sh

      - name: Stop & Remove Disposable PostgreSQL Instance
        if: always()
        run: |
          PG_DATA="${RUNNER_TEMP}/ci_pgdata"
          if [[ -d "${PG_DATA}" ]]; then
            pg_ctl -D "${PG_DATA}" -m immediate stop >/dev/null 2>&1 || true
            rm -rf "${PG_DATA}" "${RUNNER_TEMP}/ci_pgsock" "${RUNNER_TEMP}/ci_pg.log"
          fi

      - name: Package Application DMG (Ad-Hoc Signed)
        run: |
          set -euo pipefail
          ./scripts/package-app.sh \
            --skip-bridge-build \
            --configuration release \
            --signing-mode adhoc \
            --dmg \
            --require-liquid-glass \
            --version "${{ steps.mode.outputs.version }}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --commit "${GITHUB_SHA::7}" \
            --archive-name "${{ steps.mode.outputs.archive_name }}" \
            --output-dir "${RUNNER_TEMP}/dist"

      - name: Verify Relocated DMG & Launch App
        run: |
          set -euo pipefail
          ./scripts/verify-dmg.sh \
            --require-liquid-glass \
            --isolate-repo-build-dirs \
            "${RUNNER_TEMP}/dist/${{ steps.mode.outputs.archive_name }}.dmg"

      - name: Upload DMG & Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/dist/${{ steps.mode.outputs.archive_name }}.dmg
            ${{ runner.temp }}/dist/${{ steps.mode.outputs.archive_name }}.dmg.sha256
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-and-test]
    if: needs.build-and-test.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.build-and-test.outputs.release_tag }}
      cancel-in-progress: false

    steps:
      - name: Download Packaged DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-and-test.outputs.artifact_name }}
          path: dist

      - name: Verify SHA-256 Checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "${{ needs.build-and-test.outputs.archive_name }}.dmg.sha256"

      - name: Generate Release Notes
        env:
          ARCHIVE_NAME: ${{ needs.build-and-test.outputs.archive_name }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          set -euo pipefail
          SHA_VAL="$(awk '{print $1}' "dist/${ARCHIVE_NAME}.dmg.sha256")"

          cat <<EOF > release_notes.md
          ## LucidSQL ${VERSION}

          ### System Requirements & Architecture
          - **macOS:** macOS 14.0 (Sonoma) or later
          - **Appearance:** Native Liquid Glass styling on macOS 26+ (compiled with macOS 26 SDK), with automatic fallback styling on macOS 14–15
          - **Architecture:** Apple Silicon (\`arm64\` only — Intel x86_64 is not included)

          ### Installation & Signing Notice (Ad-Hoc / Unnotarized)
          LucidSQL is distributed as an **ad-hoc signed, unnotarized** macOS app bundle (no paid Apple Developer ID certificate). Because it is unnotarized, macOS Gatekeeper will warn on first launch after downloading.

          To install and open LucidSQL:
          1. Open \`${ARCHIVE_NAME}.dmg\` and drag **LucidSQL.app** to **Applications**.
          2. Open **LucidSQL.app** once and dismiss the Gatekeeper prompt.
          3. Open **System Settings → Privacy & Security**, scroll to **Security**, and click **Open Anyway** next to LucidSQL.
          4. Click **Open** to confirm. (Do not globally disable Gatekeeper.)

          ### Downloads & Verification
          - \`${ARCHIVE_NAME}.dmg\`
          - \`${ARCHIVE_NAME}.dmg.sha256\` (\`${SHA_VAL}\`)

          Verify integrity in Terminal:
          \`\`\`bash
          shasum -a 256 -c ${ARCHIVE_NAME}.dmg.sha256
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-test.outputs.release_tag }}
          ARCHIVE_NAME: ${{ needs.build-and-test.outputs.archive_name }}
          IS_PRERELEASE: ${{ needs.build-and-test.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${RELEASE_TAG} already exists. Aborting to prevent duplicate release publication."
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            "dist/${ARCHIVE_NAME}.dmg" \
            "dist/${ARCHIVE_NAME}.dmg.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "LucidSQL ${RELEASE_TAG}" \
            --notes-file release_notes.md \
            --generate-notes \
            ${PRERELEASE_FLAG}
