<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="topWallGrad" x1="256" y1="378" x2="768" y2="378" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.86"/>
      <stop offset="22%" stop-color="#67E8F9" stop-opacity="0.84"/>
      <stop offset="56%" stop-color="#0EA5E9" stop-opacity="0.84"/>
      <stop offset="86%" stop-color="#0284C7" stop-opacity="0.82"/>
